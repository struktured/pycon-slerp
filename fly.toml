# fly.toml app configuration file generated for pycon-slerp on 2026-05-16T09:52:29-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'pycon-slerp'
primary_region = 'lax'

[build]

[env]
  PORT = '8080'
  PYCON_DATA_DIR = '/data'

[[mounts]]
  source = 'pycon_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
